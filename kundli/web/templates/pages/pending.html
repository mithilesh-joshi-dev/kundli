<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>प्रतीक्षा — कुंडली ज्योतिष</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 flex items-center justify-center p-4">

  <div class="w-full max-w-sm text-center">

    <div class="text-5xl mb-4">⏳</div>
    <h1 class="text-xl font-bold text-gray-900 mb-2">मंजुरीची प्रतीक्षा</h1>
    <p class="text-sm text-gray-500 mb-2">
      तुमची नोंदणी झाली आहे.
      <br>संचालक लवकरच प्रवेश देतील.
    </p>

    {% if current_user %}
    <p class="text-xs text-gray-400 mb-6">{{ current_user.get("email", "") }}</p>
    {% endif %}

    <a href="/auth/logout"
       class="inline-block text-sm text-saffron-600 hover:underline mt-4">
      साइन आउट करा
    </a>

  </div>

</body>
</html>
